services:
  keelson-api:
    build: ./keelson-api
    ports:
      - "8000:8000"
    volumes:
      - ./keelson-api:/srv
    environment:
      # Optional: pin the business date, for example KEELSON_TODAY=2026-10-12
      KEELSON_TODAY: ${KEELSON_TODAY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: ./agent
    volumes:
      - ./agent:/app
    environment:
      KEELSON_API_URL: http://keelson-api:8000
      ANTHROPIC_API_KEY:
      LLM_MODE:
      ANTHROPIC_MODEL:
    depends_on:
      keelson-api:
        condition: service_healthy

  # The page. It only reads agent/data/decisions.json (the same ./agent folder the agent writes to).
  # On purpose: no API key, no LLM_MODE and no link to the API, so the page cannot call the LLM.
  app:
    build: ./agent
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./agent:/app
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
